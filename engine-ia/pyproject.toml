[project]
name = "credit-analysis-engine"
version = "0.1.0"
description = "Agente de IA para analise de credito com orquestracao multi-agente"
requires-python = ">=3.11"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
